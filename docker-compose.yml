version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/lms_database.db:/app/lms_database.db

  frontend:
    build:
      context: .
    ports:
      - "3000:80"
    depends_on:
      - backend
